version: '3.8'
services:
  postgres-db:
    image: postgis/postgis:latest
    container_name: kurye_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Password123*
      POSTGRES_DB: KuryeDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:latest
    container_name: kurye_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: